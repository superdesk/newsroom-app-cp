{% extends "layout.html" %}

{% block content %}
<section class="content p-5">
    <div class="jumbotron">
        <h1>This password reset link is no longer valid</h1>
        <p class="lead">The link may have expired or already been used. Please request a new password reset link to continue.</p>
        <p><a href="{{ url_for('auth.token', token_type='reset_password') }}">Reset your password</a></p>
    </div>
</section>
{% endblock %}
